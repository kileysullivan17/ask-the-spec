# Builds the container on every push and pull request, starts it, and checks
# that it serves: health, the page, a guardrail refusal and the MCP tool list.
# None of those need an API key: the smoke test mounts a stand-in index and
# asks only a question the guardrail refuses before any model call.
# On main, the image is published to GitHub Container Registry as
# ghcr.io/<owner>/ask-the-spec, tagged latest and with the commit SHA.

name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t ask-the-spec:ci .

      - name: Start with a stand-in index
        run: |
          mkdir -p /tmp/idx
          node -e '
            const c = require("./data/chunks.json");
            require("fs").writeFileSync("/tmp/idx/index.json",
              JSON.stringify({ chunks: c.map((x) => ({ ...x, vector: [0.1, 0.2, 0.3] })) }));'
          chmod 644 /tmp/idx/index.json
          docker run -d --name ats -p 8080:8080 \
            -e BANNED_NAMES=placeholder \
            -v /tmp/idx/index.json:/app/data/index.json:ro \
            ask-the-spec:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done

      - name: Smoke test
        run: |
          set -e
          fail() { echo "::error::$1"; docker logs ats; exit 1; }
          h=$(curl -sf localhost:8080/health) || fail "health check failed"
          echo "$h" | grep -q '"ok":true' || fail "health not ok: $h"
          curl -sf localhost:8080/ | grep -qi "<html" || fail "page not served"
          a=$(curl -sf -X POST localhost:8080/api/ask -H 'content-type: application/json' \
            -d '{"question":"Which company built this tool?"}') || fail "/api/ask failed"
          echo "$a" | grep -q '"status":"not_covered"' || fail "guardrail did not refuse: $a"
          t=$(curl -sf -X POST localhost:8080/mcp -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}') || fail "/mcp failed"
          echo "$t" | grep -q '"ask_spec"' || fail "MCP tools missing: $t"
          echo "Health: $h"
          echo "All smoke checks passed."

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ask-the-spec
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ask-the-spec:ci "$image:latest"
          docker tag ask-the-spec:ci "$image:${{ github.sha }}"
          docker push "$image:latest"
          docker push "$image:${{ github.sha }}"
          echo "Published $image:latest and $image:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # Deploys main to Google Cloud Run once the smoke test has passed. Signs in
  # without keys (Workload Identity Federation); see scripts/gcp-setup.sh for
  # the one-time setup and the four repository variables it prints. Skipped
  # until those variables exist.
  deploy:
    needs: build
    # Also runnable by hand from the Actions tab (Run workflow on main), to redeploy without a commit.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ask-the-spec
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build the embedding index
        run: |
          VOYAGE_API_KEY="$(gcloud secrets versions access latest --secret=VOYAGE_API_KEY --project="$PROJECT")"
          echo "::add-mask::$VOYAGE_API_KEY"
          export VOYAGE_API_KEY
          npm ci --omit=dev
          node scripts/build-index.mjs

      - name: Build and push the image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT/ask-the-spec/ask-the-spec:${{ github.sha }}"
          docker build -t ask-the-spec:base .
          mkdir -p /tmp/deploy && cp data/index.json /tmp/deploy/index.json
          docker build -f Dockerfile.deploy --build-arg BASE=ask-the-spec:base -t "$image" /tmp/deploy
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE" \
            --service-account="ats-runtime@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated --port=8080 \
            --cpu=1 --memory=512Mi --concurrency=20 --min-instances=0 --max-instances=2 --cpu-boost \
            --set-env-vars=HOSTING=cloud-run \
            --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,VOYAGE_API_KEY=VOYAGE_API_KEY:latest,BANNED_NAMES=BANNED_NAMES:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest \
            --quiet
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          echo "URL=$url" >> "$GITHUB_ENV"

      - name: Check the live service
        run: |
          set -e
          h=$(curl -sf --retry 5 --retry-delay 3 "$URL/health")
          echo "$h" | grep -q '"ok":true' || { echo "::error::health not ok: $h"; exit 1; }
          a=$(curl -sf -X POST "$URL/api/ask" -H 'content-type: application/json' -d '{"question":"Which company built this tool?"}')
          echo "$a" | grep -q '"status":"not_covered"' || { echo "::error::guardrail did not refuse: $a"; exit 1; }
          {
            echo "## Deployed to Cloud Run"
            echo ""
            echo "- Service: $URL"
            echo "- Image: \`$IMAGE\`"
            echo "- Health: \`$h\`"
          } >> "$GITHUB_STEP_SUMMARY"
