# Eval gate: runs the promptfoo evaluation against every successful Vercel
# deployment and marks that commit failed if any metric drops below
# eval/promptfoo/thresholds.json.
#
# Trigger: the "Vercel" commit status turning success, which Vercel posts on
# every deployed commit. The status links to the deployment in the Vercel
# dashboard; the workflow looks that deployment up through the Vercel API to
# get its URL. Vercel's repository_dispatch event is also accepted, but this
# project was found not to send it (2026-11-23). GitHub only delivers both
# events to workflows on the default branch, so this file must be on main.
# It posts an "Eval gate" commit status on the deployed commit, so the result
# shows on the pull request and can be made a required check.
#
# Secrets (repository secrets):
#   ANTHROPIC_API_KEY                 grader model (required)
#   VERCEL_TOKEN                      looks up the deployment URL (required for the status trigger)
#   VERCEL_AUTOMATION_BYPASS_SECRET   only if preview deployments are protected

name: Eval gate

on:
  status:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to evaluate
        default: https://ask.kileysullivan.com

permissions:
  contents: read
  statuses: write

concurrency:
  group: eval-gate-${{ github.event.client_payload.git.sha || (github.event_name == 'status' && github.event.sha) || github.sha }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval gate
    # On a status event, run only for Vercel's own success status (this
    # workflow's "Eval gate" statuses also arrive as status events).
    if: github.event_name != 'status' || (github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.client_payload.git.sha || (github.event_name == 'status' && github.event.sha) || github.sha }}
      ASK_BASE_URL: ${{ github.event.client_payload.url || inputs.base_url }}
      AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Find the deployment URL
        if: github.event_name == 'status'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_URL: ${{ github.event.target_url }}
        run: |
          # target_url looks like https://vercel.com/<team>/<project>/<deployment id>
          team=$(echo "$TARGET_URL" | cut -d/ -f4)
          id=$(echo "$TARGET_URL" | cut -d/ -f6)
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret is not set"; exit 1; fi
          host=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/dpl_${id}?slug=${team}" | jq -r .url)
          if [ -z "$host" ] || [ "$host" = "null" ]; then echo "::error::Could not look up deployment $id"; exit 1; fi
          echo "DEPLOY_URL=https://$host" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark the commit pending
        if: env.AUTOMATIC == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=pending -f context="Eval gate" \
            -f description="Evaluating ${DEPLOY_URL:-$ASK_BASE_URL}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Run canaries, evaluation and gate
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          ASK_BASE_URL="${DEPLOY_URL:-$ASK_BASE_URL}"
          case "$ASK_BASE_URL" in http*) ;; *) ASK_BASE_URL="https://$ASK_BASE_URL" ;; esac
          export ASK_BASE_URL
          echo "Evaluating $ASK_BASE_URL at $SHA"
          mkdir -p eval/results
          npm run eval:gate

      - name: Report the result on the commit
        if: always() && env.AUTOMATIC == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then s=success; d="All metrics at or above thresholds"; else s=failure; d="Below threshold or errored; see the run summary"; fi
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=$s -f context="Eval gate" -f description="$d" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Keep the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: eval/results/promptfoo-*.json
          if-no-files-found: ignore
